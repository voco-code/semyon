<style>
:root{--bg:#eef5f1;--fg:#12261c;--card:#fff;--ac:#0fa958;--bd:#cfe3d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07120d;--fg:#e6fff1;--card:#0e211a;--ac:#2cff8a;--bd:#1d4535}}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}

button{background:var(--ac);color:#04140b;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700}
button.on{outline:3px solid var(--fg)}
#st{width:100%;text-align:center;opacity:.8;font-size:12px}
.obs body{background:transparent}.green body{background:#00ff00}.obs #ui,.green #ui{display:none}
#room,#desk{position:fixed;left:0;right:0;pointer-events:none}#room{top:0;height:100%;z-index:0}#desk{bottom:0;height:42%;overflow:visible;z-index:3}#w{z-index:2}
.green #room,.green #desk,.obs #room,.obs #desk{display:none}.room #ui{display:none}

<rect x="1240" y="-70" width="60" height="78" rx="8" fill="#16351f" stroke="#2cff8a" stroke-width="4"/><rect x="1380" y="-60" width="60" height="68" rx="6" fill="#4a2a2a" opacity=".85"/></svg><div id="ui"><button id="bm">🎙️ Микрофон</button><button id="bd">🥤 Пью</button><button id="ba">🚶 Ушёл</button>
<label>Громкость <input id="sn" type="range" min="1" max="20" step="1" value="8"></label>
<div id="st">Нажмите «Микрофон» и говорите — рот двигается по голосу. Клавиши: D, A, H.</div></div>
<script>
const $=s=>document.querySelector(s),h=location.hash.slice(1),B=$('#body'),HD=$('#head'),W=$('#w');
if(h=='obs'||h=='green'||h=='room')document.documentElement.classList.add(h);
let an,buf,sens=8,lvl=0,away=0,dr=0,want=0,S='sit',ts=0,X=0,up=0,sg=1,lt=0,blink=0,nb=2000;
try{sens=+localStorage.getItem('sens')||8;$('#sn').value=sens}catch(e){}
$('#sn').oninput=e=>{sens=+e.target.value;try{localStorage.setItem('sens',sens)}catch(x){}};
async function mic(){try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true}});
 const c=new (window.AudioContext||window.webkitAudioContext)();an=c.createAnalyser();an.fftSize=256;buf=new Uint8Array(256);c.createMediaStreamSource(s).connect(an);c.resume();$('#st').textContent='Микрофон работает. Говорите!'}
 catch(e){$('#st').textContent='Нет доступа к микрофону. Разрешите его в браузере (значок замка в адресной строке).'}}
$('#bm').onclick=mic;
const setAway=v=>{away=v?1:0;tog()},setWant=v=>{want=v?1:0;tog()};
const tog=()=>{$('#bd').classList.toggle('on',!!want);$('#ba').classList.toggle('on',!!away)};
$('#bd').onclick=()=>{want=want?0:1;tog()};$('#ba').onclick=()=>{away=away?0:1;tog()};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k=='d')$('#bd').click();if(k=='a')$('#ba').click();if(k=='h'){const u=$('#ui');u.style.display=u.style.display=='none'?'':'none'}});
if(h=='obs'||h=='green'||h=='room')mic();
const go=(n,t)=>{S=n;ts=t};
function tick(t){
 const dt=Math.min(.05,(t-lt)/1000||.016);lt=t;
 let v=0;if(an){an.getByteTimeDomainData(buf);let s=0;for(const x of buf){const d=(x-128)/128;s+=d*d}v=Math.min(1,Math.sqrt(s/256)*sens)}
 lvl+=(v-lvl)*(v>lvl?.6:.2);
 const e=t-ts,L=.75;let walk=0;
 if(S=='sit'){if(away)go('up',t)}
 else if(S=='up'){up=Math.min(1,e/450);if(!away)go('down',t);else if(e>500)go('out',t)}
 else if(S=='out'){up=1;walk=1;sg=1;X+=Math.min(L-X,.4*dt);if(!away)go('in',t);else if(X>=L-.01)go('gone',t)}
 else if(S=='gone'){if(!away)go('in',t)}
 else if(S=='in'){up=1;walk=1;sg=-1;X-=Math.min(X,.4*dt);if(away&&X>.05)go('out',t);else if(X<=.02)go('down',t)}
 else if(S=='down'){up=Math.max(0,1-e/450);sg=1;if(e>500)go('sit',t)}
 dr+=((S=='sit'?want:0)-dr)*.12;
 if(t>nb){blink=1;nb=t+2500+Math.random()*3000}blink=Math.max(0,blink-dt*7);
 const bs=blink>0?Math.abs(1-Math.sin((1-blink)*Math.PI))*.9+.1:1;
 $('#eL').setAttribute('transform','translate(170 208) scale(1,'+bs+')');$('#eR').setAttribute('transform','translate(230 208) scale(1,'+bs+')');
 const lx=Math.sin(t/1700)*3,ly=Math.cos(t/2300)*1.5;
 for(const k of['L','R']){$('#i'+k).setAttribute('cx',lx);$('#i'+k).setAttribute('cy',ly);$('#p'+k).setAttribute('cx',lx);$('#p'+k).setAttribute('cy',ly)}
 const o=Math.min(1,lvl*1.3);
 if(o<.08){$('#sm').style.display='';$('#mo').setAttribute('display','none')}
 else{$('#sm').style.display='none';$('#mo').removeAttribute('display');
  $('#mE').setAttribute('rx',16+o*8);$('#mE').setAttribute('ry',3+o*20);$('#tn').setAttribute('cy',262+o*10);$('#tn').setAttribute('ry',2+o*6)}
 const bob=Math.sin(t/700)*3+(walk?-Math.abs(Math.sin(t/140))*14:0)-up*22-lvl*8;
 B.setAttribute('transform','translate(200 440) scale('+(1+up*.06)+') translate(-200 -440)');
 HD.setAttribute('transform','rotate('+(Math.sin(t/1300)*2+lvl*Math.sin(t/160)*3-dr*14)+' 200 285)');
 $('#legs').setAttribute('opacity',up);
 const sw=walk?Math.sin(t/140)*22:0;$('#l1').setAttribute('transform','rotate('+sw+' 168 440)');$('#l2').setAttribute('transform','rotate('+(-sw)+' 232 440)');
 const cx=290+(232-290)*dr,cy=420+(268-420)*dr;
 $('#cup').setAttribute('transform','translate('+cx+' '+cy+') rotate('+(-34*dr)+')');$('#cup').style.opacity=dr>.02?1:0;
 W.style.zIndex=up>.3?4:2;W.style.transform='translate('+(X*innerWidth)+'px,'+bob+'px) scaleX('+sg+')';
 requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script>
<script type="module">
import {FilesetResolver,PoseLandmarker,ObjectDetector} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const st=t=>document.querySelector('#st').textContent=t,M='https://storage.googleapis.com/mediapipe-models/';
const cam=document.createElement('video');cam.playsInline=true;cam.muted=true;cam.style.cssText='position:fixed;width:2px;opacity:0;pointer-events:none';document.body.appendChild(cam);
async function mk(C,fs,p,o){for(const d of['GPU','CPU']){try{return await C.createFromOptions(fs,{baseOptions:{modelAssetPath:p,delegate:d},runningMode:'VIDEO',...o})}catch(e){}}throw 0}
async function init(){
 st('Просим камеру и микрофон — нажмите «Разрешить»…');
 try{cam.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240,frameRate:20}});await cam.play()}
 catch(e){st('Нет доступа к камере: разрешите её в адресной строке и обновите страницу. Пока работают кнопки.');return}
 mic();
 st('Загружаем распознавание (10–30 секунд при первом запуске)…');
 let pose,det;
 try{const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  pose=await mk(PoseLandmarker,fs,M+'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',{numPoses:1});
  det=await mk(ObjectDetector,fs,M+'object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite',{scoreThreshold:.35,maxResults:6});}
 catch(e){st('Не удалось загрузить распознавание: проверьте интернет. Работают кнопки.');return}
 st('АВТО: ушли из кадра — персонаж уходит, вернулись — возвращается, стакан у лица — пьёт. Кнопки не нужны.');
 let seen=performance.now(),lastD=0,drinkT=-9e3,wr=[],nose=null,pt=0,away=0;
 const loop=()=>{
  const t=performance.now();
  if(cam.readyState>=2&&cam.currentTime!=pt){pt=cam.currentTime;
   const r=pose.detectForVideo(cam,t),lm=r.landmarks&&r.landmarks[0];
   if(lm&&(lm[0].visibility==null||lm[0].visibility>.3)){seen=t;nose=lm[0];wr=[lm[15],lm[16]]}
   if(t-lastD>400){lastD=t;
    for(const o of det.detectForVideo(cam,t).detections||[]){const k=o.categories[0].categoryName;if(k!='cup'&&k!='bottle'&&k!='wine glass')continue;
     const b=o.boundingBox,cx=(b.originX+b.width/2)/cam.videoWidth,cy=(b.originY+b.height/2)/cam.videoHeight;
     for(const w of wr)if(nose&&Math.hypot(w.x-cx,w.y-cy)<.25&&Math.hypot((w.x-nose.x)*1.33,w.y-nose.y)<.26)drinkT=t}}}
  const a=t-seen>1500?1:0;if(a!=away){away=a;setAway(a)}
  setWant(t-drinkT<900&&!away);
  setTimeout(loop,50)};
 loop()}
init();
</script></body></html>
