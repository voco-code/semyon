<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#07120d;--fg:#e6fff1;--card:#0e211a;--ac:#2cff8a;--bd:#1d4535}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
#stage{height:100%;position:relative;overflow:hidden}
#w{position:absolute;left:50%;bottom:150px;height:62%;transform-origin:50% 100%;display:flex}
#av{height:100%;transform:translateX(-50%);-webkit-mask-image:radial-gradient(ellipse 76% 74% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 76% 74% at 50% 50%,#000 62%,transparent 100%)}
#av.cut{-webkit-mask-image:none;mask-image:none}
#cup{position:absolute;font-size:64px;left:0;top:50%;transition:left .25s,top .25s,opacity .25s;opacity:0}
#ui{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:var(--card);border-top:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
button,label.b{background:var(--ac);color:#04140b;border:0;border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
label.b input{display:none}
#st{width:100%;text-align:center;opacity:.85}
#cam{position:fixed;left:8px;top:8px;width:170px;border-radius:8px;transform:scaleX(-1);border:1px solid var(--bd)}
#cam.off{opacity:0;width:2px;pointer-events:none}
.obs body{background:transparent}.green body{background:#00ff00}
.obs #ui,.green #ui,.obs #cam,.green #cam{display:none}.obs #w,.green #w{bottom:20px;height:85%}
</style></head><body>

<script type="module">
import {FilesetResolver,PoseLandmarker,ObjectDetector} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const $=s=>document.querySelector(s),av=$('#av'),W=$('#w'),cam=$('#cam'),cup=$('#cup'),say=t=>$('#st').textContent=t,h=location.hash.slice(1);
if(h=='obs'||h=='green')document.documentElement.classList.add(h);
const M='https://storage.googleapis.com/mediapipe-models/',V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
let pose,det,an,buf,sens=5,run=0;
$('#sn').oninput=e=>sens=+e.target.value;
$('#pv').onclick=()=>{cam.classList.toggle('off');$('#pv').textContent=cam.classList.contains('off')?'Показать камеру':'Скрыть камеру'};
$('#f1').onchange=e=>{const f=e.target.files[0];if(f){av.src=URL.createObjectURL(f);av.classList.add('cut')}};
addEventListener('keydown',e=>{if(e.key=='h'||e.key=='H'){const u=$('#ui');u.style.display=u.style.display=='none'?'':'none'}});
async function mk(C,fs,p,o){for(const d of['GPU','CPU']){try{return await C.createFromOptions(fs,{baseOptions:{modelAssetPath:p,delegate:d},runningMode:'VIDEO',...o})}catch(e){}}throw 0}
async function media(){
 const V={video:{width:640,height:480}},A={audio:{echoCancellation:false,noiseSuppression:true}};
 try{return await navigator.mediaDevices.getUserMedia({...V,...A})}catch(e){}
 let s=new MediaStream();
 try{(await navigator.mediaDevices.getUserMedia(V)).getTracks().forEach(t=>s.addTrack(t))}catch(e){}
 try{(await navigator.mediaDevices.getUserMedia(A)).getTracks().forEach(t=>s.addTrack(t))}catch(e){}
 return s}
async function start(){
 if(run)return;run=1;say('Запрашиваем доступ к камере и микрофону — нажмите «Разрешить» в окне браузера…');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('Этот браузер не поддерживает камеру. Откройте файл в Chrome.');run=0;return}
 const s=await media(),vt=s.getVideoTracks(),at=s.getAudioTracks();
 if(!vt.length){say('Нет доступа к камере. Разрешите её (значок замка или камеры в адресной строке) и нажмите кнопку ещё раз.');run=0;return}
 cam.srcObject=new MediaStream(vt);try{await cam.play()}catch(e){}
 if(at.length){try{const c=new (window.AudioContext||window.webkitAudioContext)();an=c.createAnalyser();an.fftSize=512;buf=new Uint8Array(512);c.createMediaStreamSource(new MediaStream(at)).connect(an);document.addEventListener('click',()=>c.resume(),{once:true});c.resume()}catch(e){}}
 else say('Микрофон недоступен, аватар будет без реакции на голос. Камера работает.');
 say('Загружаем модели распознавания (первый раз 10–30 секунд)…');
 try{const fs=await FilesetResolver.forVisionTasks(V);
  pose=await mk(PoseLandmarker,fs,M+'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',{numPoses:1});
  det=await mk(ObjectDetector,fs,M+'object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite',{scoreThreshold:.35,maxResults:6});
  say('Готово! Поза тела и предметы в руках распознаются.');
 }catch(e){say('Не удалось загрузить модели: проверьте интернет и откройте файл в Chrome.')}
}
$('#go').onclick=start;
start();
document.addEventListener('pointerdown',()=>{if(!run)start()});
// состояния: sit, up (встаёт), out (идёт прочь), away, in (идёт обратно), down (садится)
let S='sit',ts=0,X=0,Y=0,R=0,Z=1,sg=1,lvl=0,present=true,lastSeen=0,lastP=0,lastD=0,pt=0,cupT=-9e3,drinkT=-9e3,drink=0,hold=0,tgt={x:0,r:0,z:1},lt=0;
const go=(n,t)=>{S=n;ts=t};
function look(t){
 if(!pose||cam.readyState<2)return;
 if(t-lastP>40&&cam.currentTime!=pt){lastP=t;pt=cam.currentTime;
  const r=pose.detectForVideo(cam,t),lm=r.landmarks&&r.landmarks[0];
  if(lm&&(lm[0].visibility==null||lm[0].visibility>.3)){lastSeen=t;present=true;
   const n=lm[0],a=lm[11],b=lm[12];
   tgt.x=Math.max(-.45,Math.min(.45,-(n.x-.5)*.9));
   tgt.r=Math.max(-16,Math.min(16,-Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI*-1));
   tgt.z=Math.max(.9,Math.min(1.2,1+(Math.abs(a.x-b.x)-.35)*.8));
   tgt.n=n;tgt.w=[lm[15],lm[16]];
  }else if(t-lastSeen>1300)present=false;}
